name: Release

# Publishes a GitHub Release with the APKs attached. Two ways to start it:
#  - push a tag like v1.2.3, or
#  - Actions tab -> Release -> "Run workflow" and enter a version (creates the tag on that commit).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag name: from the pushed tag, or from the manual-run input.
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$TAG'"; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: scripts/setup-android-env.sh

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; release APK will be unsigned (debug APK is still attached)."
          fi

      - name: Build
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
        env:
          VERSION_NAME: ${{ env.TAG }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/tttt-${TAG}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/tttt-${TAG}.apk"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
